name: Build Artifacts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: List files for debug
      run: |
        echo "--- ROOT ---"
        ls -la
        echo "--- web ---"
        ls -la web || true

    # 👇 Adjust based on actual location
    - name: Build Frontend (default)
      run: |
        cd web/default
        npm install
        npm run build

    - name: Build Frontend (classic)
      run: |
        cd web/classic
        npm install
        npm run build

    - name: Build Backend
      run: |
        go build -o new-api-linux

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build
        path: |
          web/default/build
          web/classic/build
          new-api-linux
